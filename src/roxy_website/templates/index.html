<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pi Zero Control</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        label { display: block; margin: 10px 0; }
        button { margin: 5px; padding: 8px 28px; }
        #status { margin-top: 15px; color: green; }
    </style>
</head>
<body>
    <h1>Raspberry Pi Control Panel</h1>
    <!-- Buttons for controlling the remote service and lock state -->
    <form id="server">
        <h2>Server Control</h2>
        <div>
            <label>Server Actions:</label>
            <button type="button" onclick="sendStart()">Start</button>
            <button type="button" onclick="sendStop()">Stop</button>
            <button type="button" onclick="sendRestart()">Restart</button>
            <label id="lockToogle">Change lock while service offline</label>
            <button type="button" onclick="unlock()">Unlock</button>
            <button type="button" onclick="lock()">Lock</button>
         </div>
    </form>

    <!-- Form for updating configuration values stored in config.json -->
    <form id="updateForm">
    <h2>Update Configuration</h2>
    <!-- Use 'Discord_webhook' (underscore) so it matches the server's request.form key -->
    <label>Discord Webhook: <input type="text" name="Discord_webhook" value="{{ config.get('Discord_webhook', '') }}"></label>

     <label for="conf_threshold">What should the confidance of the model be to take an action:
        <select name="conf_threshold" id="conf_threshold">
            <option value="0.5">0.5</option>
            <option value="0.75">0.75</option>
            <option value="0.9">0.9</option>
        </select></label>

    <label for="lock_state">Choose starting state for lock:
        <select name="lock_state" id="lock_state">
            <option value="unlocked">Unlocked</option>
            <option value="locked">Locked</option>
            </select></label>

    <label for="lock_override">Should locking mechanism be on or off:
        <select name="lock_override" id="lock_override">
            <option value="false">On</option>
            <option value="true">Off</option>
        </select></label>

        <button type="button" onclick="sendUpdate('Update')">Update</button>
        <button type="button" onclick="sendResetForm()">Reset</button>

    </form>

    <div id="status"></div>

    <script>
        //Function to set status with a timeout to clear it for further down
        function set_status(result) {
            document.getElementById("status").innerText =
                "Status: " + result.status + (result.error ? " (" + result.error + ")" : "");
            setTimeout(() => {
                document.getElementById("status").innerText = "";
            }, 2000);
        }

         // Send a start request to the Flask route; result is shown in the status box.
         async function sendStart() {
            const response = await fetch("/start", { method: "POST" });
            const result = await response.json();
            set_status(result);
        }

        // Ask the backend to stop the remote process.
        async function sendStop() {
            const response = await fetch("/stop", { method: "POST" });
            const result = await response.json();
            set_status(result);
        }

        // Trigger a container restart on the Pi.
        async function sendRestart() {
            const response = await fetch("/restart", { method: "POST" });
            const result = await response.json();
            set_status(result);
        }

        // Flip the lock state remotely and surface any errors to the user.
        async function lock() {
            const response = await fetch("/lock", { method: "POST" });
            const result = await response.json();
            set_status(result);
        }

        async function unlock() {
            const response = await fetch("/unlock", { method: "POST" });
            const result = await response.json();
            set_status(result);
        }

        // Collect form values, add the button action, and send everything to /update.
        async function sendUpdate(action) {
            const form = document.getElementById("updateForm");
            const formData = new FormData(form);
            formData.append("action", action);

            const response = await fetch("/update", {
                method: "POST",
                body: formData
            });
            const result = await response.json();
            set_status(result);
        }
            // Clear the form in the browser and show a quick confirmation message.
            async function sendResetForm() {
                const form = document.getElementById("updateForm");
                form.reset();
                // give quick feedback to the user
                set_status({ status: "form cleared" });
        }
    </script>
</body>
</html>

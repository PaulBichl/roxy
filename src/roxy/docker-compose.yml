services:
  camera-uploader:
    build: .
    container_name: camera-uploader
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/gpiochip0:/dev/gpiochip0
      - /dev/gpiochip1:/dev/gpiochip1
    environment:
      IMMICH_URL: https://immich.ehlers-thorsen.dk
      TZ: Europe/Copenhagen
    secrets:
      - immich_api_key  # This tells the service to use it
    volumes:
      - ./images:/images
      - /run/udev:/run/udev:ro
      - /etc/localtime:/etc/localtime:ro
      - ./config.json:/camera/config.json:ro

# THIS PART IS MISSING OR MISALIGNED
secrets:
  immich_api_key:
    file: ./secrets/immich_api_key.txt

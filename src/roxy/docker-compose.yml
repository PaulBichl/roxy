services:
    camera-uploader:
        build: .
        container_name: camera-uploader
        restart: unless-stopped
        environment:
            IMMICH_URL: instert_your_immich_url_here
        secrets:
            - "immich_api_key"
        volumes:
            - ./images:/images

secrets:
    immich_api_key:
        file: ./secrets/immich_api_key.txt
